name: Human Knowledge Contract
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  validate-human-knowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Runtime
        run: python --version
      - name: Contract negative and positive tests
        run: python .github/scripts/human_knowledge_contract.py --self-test
      - name: Validate repository examples
        run: python .github/scripts/human_knowledge_contract.py --check --profile universalis
      - name: Run repository baseline
        run: python .github/scripts/repository_quality_baseline.py --self-test --check
